<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pawthentic — gift unboxing demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #2A1F14;
    font-family: 'Inter', system-ui, sans-serif;
    color: #2A1F14;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /* page bg pattern */
  .pa-page {
    width: 100vw; height: 100vh; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 20% 30%, #6B284533 0, transparent 40%),
      radial-gradient(circle at 80% 70%, #E0573B22 0, transparent 40%),
      #2A1F14;
    overflow: hidden;
  }
  /* phone mock */
  .pa-phone {
    width: 390px; height: 844px;
    max-height: calc(100vh - 24px);
    background: #FDF6E3;
    border-radius: 48px;
    border: 10px solid #1a1208;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), inset 0 0 0 2px #00000040;
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
  }
  .pa-phone::before {
    /* notch */
    content: '';
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 28px; background: #1a1208;
    border-radius: 16px; z-index: 30;
  }
  .pa-status {
    height: 44px; flex: none; padding: 14px 28px 0;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600;
    color: #2A1F14;
    position: relative; z-index: 10;
  }
  .pa-content {
    flex: 1; display: flex; flex-direction: column;
    overflow: hidden; position: relative;
  }
  .pa-content > .pa-step {
    position: absolute; inset: 0; display: flex; flex-direction: column;
  }

  /* Animations */
  @keyframes pa-wobble {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  .pa-wobble { animation: pa-wobble 2.4s ease-in-out infinite; }

  @keyframes pa-pop {
    0% { transform: scale(1) rotate(0); }
    40% { transform: scale(1.18) rotate(-6deg); }
    70% { transform: scale(0.85) rotate(8deg); }
    100% { transform: scale(0) rotate(20deg); opacity: 0; }
  }
  .pa-pop { animation: pa-pop 800ms cubic-bezier(.34,1.56,.64,1) forwards; }

  @keyframes pa-card-in {
    0% { transform: rotate(-2.4deg) translateY(40px) scale(0.85); opacity: 0; }
    60% { transform: rotate(0deg) translateY(-6px) scale(1.04); opacity: 1; }
    100% { transform: rotate(-2.4deg) translateY(0) scale(1); opacity: 1; }
  }
  .pa-card-in { animation: pa-card-in 700ms cubic-bezier(.34,1.56,.64,1) backwards; }

  @keyframes pa-stagger-in {
    0% { transform: translateY(40px) scale(0.9); opacity: 0; }
    70% { transform: translateY(-4px) scale(1.02); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  .pa-stagger-in { animation: pa-stagger-in 600ms cubic-bezier(.34,1.56,.64,1) backwards; }

  @keyframes pa-fall {
    0%   { transform: translateY(-20px) translateX(0) rotate(0); opacity: 1; }
    100% { transform: translateY(110vh) translateX(var(--pa-drift, 0)) rotate(var(--pa-rot, 360deg)); opacity: 0.7; }
  }

  @keyframes pa-belt {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-28px); }
  }

  @keyframes pa-belt-move {
    0%   { transform: translateX(-60px); }
    100% { transform: translateX(360px); }
  }

  @keyframes pa-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes pa-claw {
    0%, 100% { transform: translateX(-50%) translateY(38px); }
    35% { transform: translateX(-50%) translateY(48px); }
    50% { transform: translateX(-50%) translateY(48px); }
    65% { transform: translateX(-50%) translateY(38px); }
  }

  @keyframes pa-arm-extend {
    0%, 100% { height: 38px; }
    35% { height: 48px; }
    50% { height: 48px; }
    65% { height: 38px; }
  }

  @keyframes pa-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }

  @keyframes pa-drop {
    0%   { transform: translateY(-80px) rotate(-15deg); opacity: 0; }
    60%  { transform: translateY(20px) rotate(8deg); opacity: 1; }
    80%  { transform: translateY(8px) rotate(-3deg); }
    100% { transform: translateY(14px) rotate(0); opacity: 1; }
  }

  @keyframes pa-wag {
    0%, 100% { transform: rotate(-12deg); }
    50% { transform: rotate(18deg); }
  }
  .pa-wag { animation: pa-wag 0.6s ease-in-out infinite; transform-origin: 160px 130px; }

  @keyframes pa-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    96% { transform: scaleY(0.1); }
  }
  .pa-blink { animation: pa-blink 4s ease-in-out infinite; transform-origin: 84px 80px; }

  @keyframes pa-step-in {
    0% { transform: translateX(40px); opacity: 0; }
    100% { transform: translateX(0); opacity: 1; }
  }
  .pa-step-in { animation: pa-step-in 380ms cubic-bezier(.34,1.56,.64,1); }

  @keyframes pa-step-out {
    0% { transform: translateX(0); opacity: 1; }
    100% { transform: translateX(-40px); opacity: 0; }
  }

  /* button press feedback */
  .pa-btn-press { transition: transform 140ms cubic-bezier(.34,1.56,.64,1); }
  .pa-btn-press:active { transform: translateY(2px) scale(0.98); }

  /* hide phone bezel on mobile */
  @media (max-width: 480px) {
    .pa-page { background: #FDF6E3; }
    .pa-phone {
      width: 100vw; height: 100vh; max-height: 100vh;
      border: none; border-radius: 0;
    }
    .pa-phone::before { display: none; }
    .pa-status { display: none; }
  }

  input, select, button { font: inherit; }
  input:focus, select:focus { box-shadow: 0 2px 0 #2A1F14, 0 0 0 3px #6B284533 !important; }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="svg.jsx"></script>
<script type="text/babel" src="flow.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const VOICES = {
  warm: {
    label: 'Warm & witty',
    s1sub: "And it's a tail-wagging good one.",
    s2note: "Hi Alex! I switched Bonnie to Pawthentic six months ago and her coat is glossier, her energy's through the roof, and dinner's now her favourite part of the day. I had to share. Biscuit is going to LOVE this. xx Sarah",
    s3sub: "Sarah told us a bit, but you know your pup best.",
    s4sub: "Real food. Gently cooked. None of the weird stuff.",
    s4badge: "Vet-formulated. Real ingredients. Zero nasties.",
    s5sub: "First box ships free. Next-day delivery on us.",
    s6title: "Biscuit's box is on its way! 🎉",
  },
  posh: {
    label: 'Polished',
    s1sub: "A two-week trial of fresh, gently-cooked dog food.",
    s2note: "Alex — Bonnie has been on Pawthentic for six months and the difference is remarkable. Better coat, more energy, genuinely excited at mealtimes. I wanted Biscuit to feel that too. — Sarah",
    s3sub: "A few quick details and we'll tailor every meal to Biscuit.",
    s4sub: "Freshly cooked. Human-grade. Vet-formulated.",
    s4badge: "Human-grade ingredients. Vet-formulated recipes.",
    s5sub: "Your first delivery is on us. Arrives next working day.",
    s6title: "Your gift is on its way! 🎉",
  },
};

function App() {
  const [T, setTweak] = window.useTweaks(/*EDITMODE-BEGIN*/{
    "voice": "warm",
    "primaryColor": "#6B2845",
    "accentColor": "#F2C744",
    "showProgress": true,
    "dogName": "Biscuit"
  }/*EDITMODE-END*/);

  const [step, setStep] = useState(0);
  const [dir, setDir] = useState(1);

  const [dog, setDog] = useState({
    name: T.dogName, breed: 'Cocker Spaniel', age: '3', ageUnit: 'years',
    activity: 'Average', notes: '',
  });
  useEffect(() => { setDog(d => ({ ...d, name: T.dogName })); }, [T.dogName]);

  const [addr, setAddr] = useState({
    name: 'Alex Morgan', line1: '14 Elm Lane', line2: '',
    city: 'Bristol', post: 'BS1 4QD', phone: '07700 900123',
  });

  const voice = VOICES[T.voice] || VOICES.warm;

  // Override PALETTE with tweaks live
  const palette = { ...window.PALETTE, plum: T.primaryColor, yellow: T.accentColor };

  const next = () => { setDir(1); setStep(s => Math.min(5, s + 1)); };
  const prev = () => { setDir(-1); setStep(s => Math.max(0, s - 1)); };
  const restart = () => { setDir(-1); setStep(0); };

  const stepProps = { onNext: next, voice, dog, setDog, addr, setAddr };
  const steps = [
    <Step1 key="s1" {...stepProps} />,
    <Step2 key="s2" {...stepProps} />,
    <Step3 key="s3" {...stepProps} />,
    <Step4 key="s4" {...stepProps} />,
    <Step5 key="s5" {...stepProps} />,
    <Step6 key="s6" {...stepProps} onRestart={restart} />,
  ];

  const time = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s/g, '');

  return (
    <div className="pa-page">
      <div className="pa-phone" data-screen-label={`0${step+1} ${['Reveal','Note','Biscuit','Menu','Address','Done'][step]}`}>
        <div className="pa-status" style={{ background: step === 0 || step === 5 ? T.accentColor : '#FDF6E3' }}>
          <span>{time}</span>
          <span style={{ display: 'flex', gap: 6, alignItems: 'center', fontSize: 12 }}>
            <span>5G</span>
            <span style={{ display: 'inline-block', width: 22, height: 11, border: '1.5px solid #2A1F14', borderRadius: 3, position: 'relative' }}>
              <span style={{ position: 'absolute', inset: 1, background: '#2A1F14', borderRadius: 1.5, width: '85%' }}></span>
            </span>
          </span>
        </div>

        {/* top bar: wordmark + progress */}
        <div style={{ flex: 'none', padding: '4px 22px 0', background: step === 0 || step === 5 ? T.accentColor : '#FDF6E3', position: 'relative', zIndex: 5 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 0' }}>
            <div onClick={step > 0 && step < 5 ? prev : undefined} style={{ cursor: step > 0 && step < 5 ? 'pointer' : 'default', width: 36, fontSize: 22, color: '#2A1F14', opacity: step > 0 && step < 5 ? 1 : 0 }}>←</div>
            <Wordmark size={22} />
            <div style={{ width: 36, textAlign: 'right', fontFamily: 'Inter', fontSize: 11, color: '#2A1F14', opacity: 0.55 }}>{step+1}/6</div>
          </div>
          {T.showProgress && <ProgressPaws step={step} voiceColor={T.primaryColor} />}
        </div>

        <div className="pa-content">
          {steps.map((s, i) => i === step ? (
            <div key={i} className="pa-step pa-step-in">{s}</div>
          ) : null)}
        </div>
      </div>

      {window.TweaksPanel && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection title="Voice & copy">
            <window.TweakRadio label="Voice"
              value={T.voice}
              options={[{value:'warm',label:'Warm'},{value:'posh',label:'Polished'}]}
              onChange={v => setTweak('voice', v)} />
            <window.TweakText label="Recipient's dog name" value={T.dogName} onChange={v => setTweak('dogName', v)} />
          </window.TweakSection>
          <window.TweakSection title="Brand colors">
            <window.TweakColor label="Primary (CTA)" value={T.primaryColor} onChange={v => setTweak('primaryColor', v)} />
            <window.TweakColor label="Accent (hero)" value={T.accentColor} onChange={v => setTweak('accentColor', v)} />
          </window.TweakSection>
          <window.TweakSection title="Demo">
            <window.TweakToggle label="Show progress paws" value={T.showProgress} onChange={v => setTweak('showProgress', v)} />
            <window.TweakSelect label="Jump to step"
              value={String(step)}
              options={[
                {value:'0',label:'1 — Reveal'},
                {value:'1',label:'2 — Note'},
                {value:'2',label:'3 — About Biscuit'},
                {value:'3',label:'4 — Menu'},
                {value:'4',label:'5 — Address'},
                {value:'5',label:'6 — Done'},
              ]}
              onChange={v => setStep(parseInt(v))} />
            <window.TweakButton onClick={restart}>Restart demo</window.TweakButton>
          </window.TweakSection>
        </window.TweaksPanel>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
